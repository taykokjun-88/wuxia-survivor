# 把网页版自动部署到 GitHub Pages（先跑全套测试门禁，通过后再导出并发布）。
# 用法：仓库 Settings → Pages → Source 选 "GitHub Actions"；之后每次推送到 main 或开发分支自动测试、构建并发布。
# 也可以在 Actions 页手动运行（workflow_dispatch）。
name: Deploy web build to GitHub Pages

on:
  push:
    # main 之后合并时发布；开发分支每次推送也发布，方便边做边看
    branches: [main, claude/confident-dirac-vholjn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test_backend_and_audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 音频版权审计
        run: python3 tools/audit_audio.py
      - name: 后端单测（plain + smart）
        run: node backend/test/backend.test.js

  test_godot:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: 导入资源并运行 Godot 无头全套测试
        run: |
          godot --headless --path . --import || true
          godot --headless --path . res://tests/sim_test.tscn
      - name: 导出客户端合法天赋样本（供前后端交叉检查）
        run: |
          godot --headless --path . res://tests/talent_dump.tscn 2>/dev/null | grep "^TALENT_CASE " | sed 's/^TALENT_CASE //' > talent_cases.txt
          test -s talent_cases.txt
      - uses: actions/upload-artifact@v4
        with:
          name: talent-cases
          path: talent_cases.txt
          retention-days: 1

  test_talent_cross:
    needs: test_godot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: talent-cases
      - name: 前后端天赋规则交叉检查
        run: node backend/test/talent_cross.js < talent_cases.txt

  build:
    needs: [test_backend_and_audio, test_talent_cross]
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: 安装导出模板
        # 作业里的 HOME 和镜像里的 /root 不是同一个目录，所以要把镜像自带的模板复制过来。
        # 不依赖 GODOT_VERSION 环境变量（这个镜像里它是空的）。
        run: |
          godot --version
          ls -la /root/.local/share/godot/export_templates/
          mkdir -p ~/.local/share/godot/export_templates
          cp -r /root/.local/share/godot/export_templates/. ~/.local/share/godot/export_templates/
          ls -la ~/.local/share/godot/export_templates/
      - name: 导出 Web
        run: |
          mkdir -p export/web
          godot --headless --path . --import || true
          godot --headless --path . --export-release "Web" export/web/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: export/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
