html/head_include="<style>#wx-rotate{position:fixed;inset:0;z-index:99999;display:none;flex-direction:column;align-items:center;justify-content:center;background:#0a0c12;color:#f3ead2;font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif;text-align:center;padding:24px;box-sizing:border-box}#wx-rotate h1{font-size:30px;margin:18px 0 8px;letter-spacing:4px}#wx-rotate p{margin:4px 0;font-size:16px;color:#cfc6ae;line-height:1.5}#wx-rotate p.tip{font-size:14px;color:#9a9078}#wx-rotate button{margin-top:14px;font-size:18px;padding:12px 22px;border-radius:8px;border:1px solid #c9a227;background:#2a2418;color:#f3ead2}#wx-rotate button.ghost{border-color:#555;background:transparent;color:#8d8670;font-size:15px;padding:8px 16px}@keyframes wxspin{0%,15%{transform:rotate(0)}55%,85%{transform:rotate(90deg)}100%{transform:rotate(0)}}#wx-rotate svg{animation:wxspin 2.6s ease-in-out infinite}#qx-edit{position:fixed;inset:0;z-index:100000;display:none;align-items:flex-start;justify-content:center;background:rgba(6,8,12,.72);font-family:-apple-system,\"PingFang SC\",\"Microsoft YaHei\",sans-serif}#qx-edit .box{margin-top:10vh;width:min(86vw,460px);background:#1c1a14;border:1px solid #c9a227;border-radius:12px;padding:18px;box-sizing:border-box;color:#f3ead2}#qx-edit .t{font-size:17px;margin-bottom:10px;color:#e6c65a}#qx-edit input{width:100%;box-sizing:border-box;font-size:20px;padding:12px;border-radius:8px;border:1px solid #6b5d2e;background:#0f0e0a;color:#f3ead2;outline:none}#qx-edit .row{display:flex;gap:12px;margin-top:14px}#qx-edit button{flex:1;font-size:18px;padding:12px;border-radius:8px;border:1px solid #c9a227;background:#2a2418;color:#f3ead2}#qx-edit button.no{border-color:#555;background:transparent;color:#8d8670}</style><script>(function(){var dismissed=false;function coarse(){try{return window.matchMedia('(pointer: coarse)').matches;}catch(e){return false;}}function portrait(){return window.innerHeight>window.innerWidth;}function update(){var show=!dismissed&&coarse()&&portrait();window.__wuxiaPortraitBlock=show;var d=document.getElementById('wx-rotate');if(d)d.style.display=show?'flex':'none';}function build(){var d=document.createElement('div');d.id='wx-rotate';var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);var canFs=!!document.documentElement.requestFullscreen&&!ios;d.innerHTML='<svg width=\"96\" height=\"96\" viewBox=\"0 0 96 96\"><rect x=\"28\" y=\"8\" width=\"40\" height=\"80\" rx=\"7\" fill=\"none\" stroke=\"#e6c65a\" stroke-width=\"4\"/><circle cx=\"48\" cy=\"79\" r=\"3\" fill=\"#e6c65a\"/></svg>'+'<h1>请横屏游玩</h1><p>把手机 / 平板横过来，操作和画面都更舒服</p>'+(ios?'<p class=\"tip\">iPhone / iPad：请先在「控制中心」关闭「竖排方向锁定」，再横握设备</p>':'<p class=\"tip\">若没有反应，请打开系统的「自动旋转」</p>')+(canFs?'<button id=\"wx-fs\">全屏并锁定横屏</button>':'')+'<button class=\"ghost\" id=\"wx-skip\">仍然竖屏游玩</button>';document.body.appendChild(d);var fs=document.getElementById('wx-fs');if(fs)fs.onclick=function(){var p=document.documentElement.requestFullscreen();Promise.resolve(p).then(function(){return screen.orientation&&screen.orientation.lock?screen.orientation.lock('landscape'):0;}).catch(function(){});};document.getElementById('wx-skip').onclick=function(){dismissed=true;update();};update();}if(document.body)build();else document.addEventListener('DOMContentLoaded',build);window.addEventListener('resize',update);window.addEventListener('orientationchange',function(){setTimeout(update,200);});window.__wuxiaPortraitBlock=false;})();</script><script>(function(){var cb=null,lock=0;var savedFocus=null,dbg=/[?&]dbg=1/.test(location.search),logs=[];function log(m){if(!dbg)return;logs.push(m);if(logs.length>8)logs.shift();var e=document.getElementById('qx-log');if(e)e.textContent=logs.join(' · ');}function holdCanvas(){var c=document.querySelector('canvas');if(c&&!savedFocus){savedFocus=c.focus;c.focus=function(){};c._pe=c.style.pointerEvents;c.style.pointerEvents='none';try{c.blur();}catch(e){}}}function freeCanvas(){var c=document.querySelector('canvas');if(c&&savedFocus){c.focus=savedFocus;savedFocus=null;c.style.pointerEvents=c._pe||'';}}function build(){var d=document.createElement('div');d.id='qx-edit';d.innerHTML='<div class=\"box\"><div class=\"t\" id=\"qx-t\"></div><input id=\"qx-i\" autocomplete=\"off\" autocapitalize=\"off\" autocorrect=\"off\" spellcheck=\"false\"><div id=\"qx-log\" style=\"font-size:12px;color:#8d8670;margin-top:8px;min-height:14px\"></div><div class=\"row\"><button class=\"no\" id=\"qx-no\">取消</button><button id=\"qx-ok\">确定</button></div></div>';document.body.appendChild(d);var i=document.getElementById('qx-i');function done(ok){if(Date.now()<lock)return;d.style.display='none';i.blur();freeCanvas();var f=cb;cb=null;if(f)f(ok?1:0,i.value);}i.addEventListener('blur',function(){log('blur');if(d.style.display!=='none'&&!done.closing){setTimeout(function(){if(d.style.display!=='none'&&document.activeElement!==i&&!(document.activeElement&&document.activeElement.tagName==='BUTTON')){try{i.focus();}catch(e){}log('refocus');}},60);}});i.addEventListener('focus',function(){log('focus');});document.getElementById('qx-ok').onclick=function(){done(true);};document.getElementById('qx-no').onclick=function(){done(false);};i.addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();done(true);}});d.addEventListener('click',function(e){if(e.target===d)done(false);});}if(document.body)build();else document.addEventListener('DOMContentLoaded',build);window.qxCoarse=function(){try{if(window.matchMedia('(pointer: coarse)').matches||window.matchMedia('(any-pointer: coarse)').matches)return true;}catch(e){}var ios=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);return ios||/Android/.test(navigator.userAgent);};['keydown','keyup','keypress','beforeinput','input','touchstart','touchmove','touchend','touchcancel','pointerdown','pointerup','pointermove','mousedown','mouseup','click','wheel'].forEach(function(n){document.addEventListener(n,function(e){var t=e.target;if(t&&t.closest&&t.closest('#qx-edit'))e.stopPropagation();});});window.qxLast=0;['pointerdown','touchstart','mousedown'].forEach(function(n){window.addEventListener(n,function(){window.qxLast=Date.now();},true);});window.qxRecent=function(){return Date.now()-window.qxLast<900;};window.qxEdit=function(title,value,secret,maxlen,callback){var d=document.getElementById('qx-edit');if(!d)return false;cb=callback;lock=Date.now()+400;document.getElementById('qx-t').textContent=title;var i=document.getElementById('qx-i');i.type=secret?'password':'text';i.value=value||'';i.maxLength=maxlen>0?maxlen:524288;d.style.display='flex';holdCanvas();var tries=0;(function f(){try{i.focus();i.select();}catch(e){}if(++tries<6&&document.activeElement!==i)setTimeout(f,120);})();return true;};})();</script>"
